<svg xmlns="http://www.w3.org/2000/svg" width="860" height="160" viewBox="0 0 860 160">
  <style>
    .box { fill: #fff; stroke: #000; }
    text { font-family: sans-serif; font-size: 14px; }
    .arrow { stroke: #000; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
  </defs>
  <!-- boxes -->
  <rect class="box" x="10" y="60" width="110" height="40" />
  <text x="65" y="85" text-anchor="middle">Browser</text>

  <rect class="box" x="150" y="60" width="110" height="40" />
  <text x="205" y="85" text-anchor="middle">/discover</text>

  <rect class="box" x="290" y="60" width="120" height="40" />
  <text x="350" y="85" text-anchor="middle">EventSource</text>

  <rect class="box" x="450" y="20" width="150" height="40" />
  <text x="525" y="45" text-anchor="middle">discover_cameras</text>

  <rect class="box" x="450" y="100" width="150" height="40" />
  <text x="525" y="125" text-anchor="middle">_scan_* functions</text>

  <!-- arrows forward -->
  <path class="arrow" d="M120 80 L150 80" />
  <path class="arrow" d="M260 80 L290 80" />
  <path class="arrow" d="M410 80 L450 40" />
  <path class="arrow" d="M410 80 L450 120" />
  <!-- arrow from scans back to EventSource -->
  <path class="arrow" d="M600 120 L720 120 L720 80 L410 80" />
  <!-- arrow from EventSource back to Browser -->
  <path class="arrow" d="M350 100 L350 140 L65 140 L65 100" />
  <text x="730" y="110" font-size="12">results</text>
  <text x="75" y="132" font-size="12">updates</text>
</svg>
