repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
      - id: lint-js
        name: lint js
        entry: npm run lint:js
        language: system
        pass_filenames: false
      - id: format-js
        name: format js write
        entry: npm run format:js:write
        language: system
        pass_filenames: false
      - id: lint-css
        name: lint css
        entry: npm run lint:css
        language: system
        pass_filenames: false
