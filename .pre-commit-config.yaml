minimum_pre_commit_version: "3.6.0"

repos:
  # Pinned wheel from PyPI – no Git clone, no tag problems
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        # install the exact version you need inside the hook venv
        additional_dependencies: ["black==25.1.0"]
        types: [python]

  # keep flake8 (example)
  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: python
        # install the exact version you need inside the hook venv
        additional_dependencies: ["flake8==7.0.0"]
        types: [python]
