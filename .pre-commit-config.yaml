repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (black-profile)
        entry: isort --profile=black
        language: system
      - id: black
        name: black
        entry: black
        language: system
      - id: flake8
        name: flake8
        entry: flake8
        language: system
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
      - id: lint-js
        name: lint js
        entry: npm run lint:js
        language: system
      - id: format-js
        name: format js write
        entry: npm run format:js:write
        language: system
      - id: lint-css
        name: lint css
        entry: npm run lint:css
        language: system
