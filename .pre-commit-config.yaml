minimum_pre_commit_version: "3.6.0"
# All hooks must be local to allow offline usage

# ─── PYTHON ────────────────────────────────────────────────────────────────────
# NOTE: hooks run in the order they appear – Ruff check before Ruff format.
repos:
  - repo: local
    hooks:
      # 1️⃣  Ruff fixes (import sorting, lint autofixes)
      - id: ruff
        name: ruff (fix)
        entry: ruff check --fix
        language: system
        types: [python]

      # 2️⃣  Ruff formatting
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --exit-zero
        language: system
        types: [python]

  - repo: local
    hooks:
      # 4️⃣  mypy is expensive – run it only when you push (or manually)
      - id: mypy
        name: mypy (push only)
        entry: uv run mypy --config-file=mypy.ini
        language: system
        types: [python]
        stages: [pre-push]

  # ─── JAVASCRIPT / CSS ──────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: lint-js
        name: lint js
        entry: npm run lint:js
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: format-js
        name: format js write
        entry: npm run format:js:write
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-css
        name: lint css
        entry: npm run lint:css
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: check-exclude-docs
        name: docs exclude list in sync
        entry: uv run python scripts/check_exclude_docs.py
        language: system
        pass_filenames: false
  - repo: local
    hooks:
      - id: check-docs-nav
        name: docs navigation complete
        entry: uv run python scripts/check_docs_nav.py
        language: system
        pass_filenames: false

  - repo: local
    hooks:
      - id: detect-secrets
        name: detect secrets
        entry: uv run ./detect-secrets-hook
        language: system

  - repo: local
    hooks:
      - id: check-yaml-format
        name: prettier yaml
        entry: npx prettier --check '*.yml'
        language: system
        pass_filenames: false
        stages: [pre-commit]
