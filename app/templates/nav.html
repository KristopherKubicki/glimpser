<h1>
  <a href="/" title="Home">
    <img src="{{ url_for('static', filename='img/glimpser_small.png') }}" loading="lazy" alt="Glimpser logo" title="Glimpser" />
  </a>
</h1>
<div id="caption-chyron" class="caption-chyron" aria-live="polite"></div>
<nav>
  <button id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation">☰</button>
  <div class="nav-left">
    {% for ag in active_groups %}
    <a href="/group/{{ ag }}" title="View group {{ ag }}">{{ ag }}</a>
    {% endfor %}
    <!-- Discover icon moved to nav-right for consistency -->
  </div>

  <div class="nav-center">
    {% if template_name %}
    <h1><a href="/templates/{{ template_name }}" title="View template {{ template_name }}">{{ template_name }}</a></h1>
    {% endif %}
  </div>

  <div class="nav-right">
    {% if session.get('user_id') %}
    <a id="health-status" href="/status" class="status-indicator" title="System Performance" aria-label="System Performance">
      <svg width="18" height="18">
        <use href="{{ url_for('static', filename='icons/sprite.svg') }}#check" />
      </svg>
    </a>
    <a id="danger-status" href="/danger" class="status-indicator" title="Danger Mode" aria-label="Danger Mode">
      <svg width="18" height="18">
        <use href="{{ url_for('static', filename='icons/sprite.svg') }}#alert" />
      </svg>
    </a>
    <a id="discover-status" href="/discover" class="status-indicator" title="Discover Cameras" aria-label="Discover Cameras">
      <svg width="20" height="20">
        <use href="{{ url_for('static', filename='icons/sprite.svg') }}#search" />
      </svg>
    </a>
    <div class="caption-container">
      <a href="/captions" id="captions" class="settings-icon" title="Read and update camera LLMs" aria-label="Read and update camera LLMs">
        <svg width="20" height="20">
          <use href="{{ url_for('static', filename='icons/sprite.svg') }}#comment" />
        </svg>
      </a>
    </div>
    <a href="/live" id="live" aria-label="Open Live page">
      <div id="coolClock" class="cool-clock" title="Open the Live page. Select a camera and choose 'Live Video' for realtime streaming." aria-label="Open Live page for realtime streaming">
        <div id="dateDisplay" class="clock-face">
          <div id="digitalTime" class="clock-hands" title="">
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
          </div>
        </div>
      </div>
    </a>
    <a href="/settings" class="settings-icon" title="Update settings" aria-label="Update settings">
      <svg width="20" height="20">
        <use href="{{ url_for('static', filename='icons/sprite.svg') }}#gear" />
      </svg>
    </a>
    {% else %}
    <a href="{{ url_for('login') }}" class="settings-icon" title="Login" aria-label="Login">
      <svg width="20" height="20">
        <use href="{{ url_for('static', filename='icons/sprite.svg') }}#login" />
      </svg>
    </a>
    {% endif %}
  </div>
</nav>
