{% extends 'base.html' %}
{% block content %}
    <div class="login-wrapper">
    <div class="login-container" title="Login form">
        <h2>Login Required</h2>
        <form method="post" title="Enter your credentials to log in">
            Username:<br>
            <input type="text" name="username" required title="Enter your username"><br>
            Password:<br>
            <input type="password" name="password" required title="Enter your password"><br>
            TOTP Code:<br>
            <input type="text" name="totp_code" title="Time-based one-time password"><br><br>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}
            <input type="submit" value="Login" title="Click to log in">
        </form>
    </div>
    </div>
{% endblock %}
