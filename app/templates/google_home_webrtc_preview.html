<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google WebRTC Preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      #sdm-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
        pointer-events: none;
      }
      #sdm-still {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: auto;
        pointer-events: none;
        opacity: 0;
      }
      #status {
        position: fixed;
        left: 8px;
        top: 8px;
        color: #ddd;
        background: rgba(0, 0, 0, 0.55);
        font: 12px/1.3 monospace;
        padding: 4px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="sdm-video" autoplay playsinline muted></video>
      <img id="sdm-still" alt="Google camera preview" />
      <canvas id="sdm-canvas" style="display: none"></canvas>
      <div id="status">connecting…</div>
    </div>

    <script>
      (function () {
        const profile = {{ profile|tojson }};
        const deviceId = {{ device_id|tojson }};
        const token = {{ token|tojson }};
        const startUrl = {{ url_for("ui.google_webrtc_start")|tojson }};
        const extendUrl = {{ url_for("ui.google_webrtc_extend")|tojson }};
        const stopUrl = {{ url_for("ui.google_webrtc_stop")|tojson }};

        const statusEl = document.getElementById("status");
        const videoEl = document.getElementById("sdm-video");
        const stillEl = document.getElementById("sdm-still");
        const canvas = document.getElementById("sdm-canvas");
        const ctx = canvas.getContext("2d");

        let pc = null;
        let mediaSessionId = "";
        let drawTimer = null;
        let extendTimer = null;
        let goodFrameStreak = 0;

        const setStatus = (text) => {
          statusEl.textContent = text;
        };

        const withToken = (u) => {
          if (!token) return u;
          const sep = u.includes("?") ? "&" : "?";
          return `${u}${sep}token=${encodeURIComponent(token)}`;
        };

        const apiPost = async (url, body) => {
          const resp = await fetch(withToken(url), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...body, profile, device_id: deviceId, token }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) {
            throw new Error(data.error || `HTTP ${resp.status}`);
          }
          return data;
        };

        const waitForIceGathering = (peer, timeoutMs = 6000) =>
          new Promise((resolve) => {
            if (!peer || peer.iceGatheringState === "complete") {
              resolve();
              return;
            }
            const done = () => {
              try {
                peer.removeEventListener("icegatheringstatechange", onState);
              } catch (_e) {}
              if (timer) window.clearTimeout(timer);
              resolve();
            };
            const onState = () => {
              if (peer.iceGatheringState === "complete") done();
            };
            const timer = window.setTimeout(done, timeoutMs);
            peer.addEventListener("icegatheringstatechange", onState);
          });

        const startCanvasPump = () => {
          if (drawTimer) window.clearInterval(drawTimer);
          stillEl.dataset.ready = "";
          goodFrameStreak = 0;

          const frameLooksLive = (w, h) => {
            try {
              // Sample only the center of the frame. A zero-variance center is a
              // strong signal that WebRTC connected but never delivered real video.
              const sw = Math.max(64, Math.floor(w * 0.28));
              const sh = Math.max(64, Math.floor(h * 0.28));
              const sx = Math.max(0, Math.floor((w - sw) / 2));
              const sy = Math.max(0, Math.floor((h - sh) / 2));
              const data = ctx.getImageData(sx, sy, sw, sh).data;
              let n = 0;
              let sum = 0;
              let sumSq = 0;
              for (let i = 0; i < data.length; i += 16) {
                const y = 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
                sum += y;
                sumSq += y * y;
                n += 1;
              }
              if (!n) return false;
              const mean = sum / n;
              const variance = Math.max(0, sumSq / n - mean * mean);
              const std = Math.sqrt(variance);
              return std > 1.2 || mean > 5.0;
            } catch (_e) {
              return true;
            }
          };

          drawTimer = window.setInterval(() => {
            if (videoEl.readyState < 2) return;
            const w = Math.max(videoEl.videoWidth || 1280, 320);
            const h = Math.max(videoEl.videoHeight || 720, 180);
            if (canvas.width !== w || canvas.height !== h) {
              canvas.width = w;
              canvas.height = h;
            }
            ctx.drawImage(videoEl, 0, 0, w, h);
            const looksLive = frameLooksLive(w, h);
            if (looksLive) {
              goodFrameStreak += 1;
              stillEl.src = canvas.toDataURL("image/jpeg", 0.86);
              if (goodFrameStreak >= 2) {
                stillEl.dataset.ready = "1";
              }
              setStatus(`live ${w}x${h}`);
            } else {
              goodFrameStreak = 0;
              stillEl.dataset.ready = "";
              setStatus("waiting for video frame…");
            }
          }, 350);
        };

        const startKeepAlive = () => {
          if (extendTimer) window.clearInterval(extendTimer);
          extendTimer = window.setInterval(async () => {
            if (!mediaSessionId) return;
            try {
              await apiPost(extendUrl, { media_session_id: mediaSessionId });
            } catch (err) {
              setStatus(`extend failed: ${err.message}`);
            }
          }, 45_000);
        };

        const stopSession = async () => {
          if (drawTimer) window.clearInterval(drawTimer);
          if (extendTimer) window.clearInterval(extendTimer);
          if (pc) {
            try {
              pc.close();
            } catch (_e) {}
            pc = null;
          }
          if (mediaSessionId) {
            try {
              await apiPost(stopUrl, { media_session_id: mediaSessionId });
            } catch (_e) {}
            mediaSessionId = "";
          }
        };

        const start = async () => {
          setStatus("creating offer…");
          pc = new RTCPeerConnection({
            iceServers: [
              { urls: "stun:stun.l.google.com:19302" },
              { urls: "stun:stun1.l.google.com:19302" },
            ],
          });
          pc.addTransceiver("audio", { direction: "recvonly" });
          pc.addTransceiver("video", { direction: "recvonly" });
          try {
            // SDM requires audio/video/application m-lines in the offer.
            pc.createDataChannel("glimpser");
          } catch (_e) {}

          pc.ontrack = (event) => {
            const stream = event.streams && event.streams[0];
            if (stream) {
              videoEl.srcObject = stream;
              try {
                const p = videoEl.play();
                if (p && typeof p.catch === "function") p.catch(() => {});
              } catch (_e) {}
              startCanvasPump();
            }
          };
          pc.onconnectionstatechange = () => {
            if (pc && pc.connectionState) {
              setStatus(`state: ${pc.connectionState}`);
            }
          };

          const offer = await pc.createOffer({
            offerToReceiveVideo: true,
            offerToReceiveAudio: true,
          });
          await pc.setLocalDescription(offer);
          await waitForIceGathering(pc);
          const localSdp = String(
            (pc.localDescription && pc.localDescription.sdp) || offer.sdp || ""
          );

          setStatus("requesting answer…");
          const startResp = await apiPost(startUrl, {
            offer_sdp: localSdp,
          });
          mediaSessionId = String(startResp.media_session_id || "");
          let answerSdp = String(startResp.answer_sdp || "");
          // SDM answers can include direction/sctp lines Chrome rejects in
          // strict mode. Normalize to a Chrome-compatible answer.
          if (answerSdp) {
            const out = [];
            for (const line of answerSdp
              .replace(/\r\n/g, "\n")
              .replace(/\r/g, "\n")
              .split("\n")) {
              const trimmed = line.trim();
              if (!trimmed) continue;

              if (trimmed === "a=sendrecv") {
                out.push("a=sendonly");
                continue;
              }

              const appLine = trimmed.match(/^m=application\s+(\d+)\s+DTLS\/SCTP\s+\d+/i);
              if (appLine) {
                out.push(`m=application ${appLine[1]} UDP/DTLS/SCTP webrtc-datachannel`);
                continue;
              }

              const sctpMap = trimmed.match(/^a=sctpmap:(\d+)\s+\S+(?:\s+(\d+))?/i);
              if (sctpMap) {
                out.push(`a=sctp-port:${sctpMap[1]}`);
                if (sctpMap[2]) out.push(`a=max-message-size:${sctpMap[2]}`);
                continue;
              }

              out.push(trimmed);
            }
            answerSdp = `${out.join("\r\n")}\r\n`;
          }
          try {
            await pc.setRemoteDescription({
              type: "answer",
              sdp: answerSdp,
            });
          } catch (err) {
            const sctp = answerSdp
              .split(/\r?\n/)
              .filter((line) => line.includes("sctp"))
              .join(" | ");
            throw new Error(`${err.message} [${sctp}]`);
          }
          startKeepAlive();
          setStatus("connected");
        };

        window.addEventListener("beforeunload", () => {
          void stopSession();
        });

        start().catch((err) => {
          setStatus(`error: ${err.message}`);
        });
      })();
    </script>
  </body>
</html>
