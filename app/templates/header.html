<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page_title %}Glimpser – {{ page_title }}{% else %}Glimpser{% endif
      %}
    </title>
    <meta
      name="description"
      content="{{ meta_description or 'Real-time monitoring and summarization for camera streams.' }}"
    />
    <meta
      property="og:title"
      content="{% if page_title %}Glimpser – {{ page_title }}{% else %}Glimpser{% endif %}"
    />
    <meta
      property="og:description"
      content="{{ meta_description or 'Real-time monitoring and summarization for camera streams.' }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ COMMIT_HASH or VERSION }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/player.css') }}?v={{ COMMIT_HASH or VERSION }}"
    />
    <link
      rel="preload"
      href="{{ url_for('static', filename='icons/sprite.svg') }}"
      as="image"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='favicon.ico') }}"
    />
    <script>
      window.IS_LOGGED_IN = {{ 'true' if session.get('user_id') or LAN_GUEST else 'false' }};
      window.IS_LAN_GUEST = {{ 'true' if LAN_GUEST else 'false' }};
      window.LOW_CPU_MODE = {{ 'true' if LOW_CPU_MODE else 'false' }};
    </script>
    {% if session.get('user_id') or LAN_GUEST %}
    <script
      type="module"
      src="{{ url_for('static', filename='js/script.js') }}?v={{ COMMIT_HASH or VERSION }}"
    ></script>
    {% endif %}
  </head>
</html>
