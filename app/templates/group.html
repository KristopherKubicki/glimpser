{% extends 'base.html' %} {% from 'components.html' import template_controls %}
{% block content %} {% call template_controls() %}{% endcall %}
<div
  id="template-list"
  title="List of all templates"
  role="region"
  aria-label="Templates"
></div>
<div id="index-time" class="corner-time" title=""></div>
<script type="module">
  import { loadTemplates } from '{{ url_for('static', filename='js/templates.js') }}';
  window.currentGroup = '{{ group_name }}';
  document.addEventListener('DOMContentLoaded', () => {
      loadTemplates();
  });
</script>
{% endblock %}
