{% extends 'base.html' %} {% from 'components.html' import status_legend %} {%
block content %}
<details id="controls-wrapper">
  <summary>Controls</summary>
  <div id="template-controls">
    <div id="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="Search cameras"
        title="Enter search terms"
      />
    </div>
    <input
      type="range"
      id="grid-width-slider"
      min="50"
      max="3840"
      value="360"
      title="Adjust the width of the template grid"
    />
    {{ status_legend() }}
    <button id="play-all-button" title="Play/Stop all videos">Play All</button>
    <button
      id="live-all-button"
      style="display: none"
      title="Return to latest screenshot"
    >
      Live
    </button>
    <div class="checkbox-row">
      <span>Captions</span>
      <label class="switch" title="Toggle caption overlays">
        <input
          id="toggle-captions"
          type="checkbox"
          checked
          aria-label="Toggle caption overlays"
        />
        <span class="slider round"></span>
      </label>
    </div>
  </div>
</details>
<div
  id="template-list"
  title="List of all templates"
  role="region"
  aria-label="Templates"
></div>
<div id="index-time" class="corner-time" title=""></div>
<script type="module">
  import { loadTemplates } from '{{ url_for('static', filename='js/templates.js') }}';
  window.currentGroup = '{{ group_name }}';
  document.addEventListener('DOMContentLoaded', () => {
      loadTemplates();
  });
</script>
{% endblock %}
