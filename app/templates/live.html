{% extends 'base.html' %}
{% block content %}
    <script>
        // Track the last time the health endpoint failed
        window.lastHealthFailed = false;
    </script>

    <style>
        .video-container {
            max-width: 100vw;
            width: 100%;
            height: 92vh; /* ensure the container doesn't collapse */
            max-height: 92vh; /* allow room for controls on small screens */
            position: relative;
            overflow: auto; /* enable scrolling if needed */
        }
        #live-video, #live-image {
            position: absolute;
            top: 0;
            left: 0;
	    width: 100%;
            max-width: 100vw;
            max-height: 92vh;
            #object-fit: cover;
        }
        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 100vw;
        }
        .video-container:hover .video-controls {
            opacity: 1;
        }
        .video-controls button {
            background-color: transparent;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
        }
        .video-controls button:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        #seek-bar {
            width: 100%;
            margin: 10px 0;
        }
        #volume-bar {
            width: 100px;
            margin: 0 10px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        #template-details {
            margin-top: 10px;
        }
    </style>

    <div class="video-container">
        <img id="live-image" alt="Live feed frame" title="Current frame from the live feed">
        <video id="live-video" class="hidden" autoplay muted>
            <source src="" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div class="video-controls">
            <input type="range" id="seek-bar" value="0">

            <div class="control-row">
                <button id="play-pause"><i class="fa-play-pause"></i> Test</button>
                <div id="speed-container">
                    <input type="range" id="speed-slider" min="-3" max="4" value="0" step="0.1" oninput="updatePlaybackSpeed()">
                    <label for="speed-slider">Speed: <span id="speed-value">1x</span></label>
                </div>

	<!-- <button id="cast-button">Cast</button> -->
                <button id="full-screen" title='fullscreen'><i class="fas fa-expand"></i></button>

    <select id="video-source" onchange="changeVideoSource()">
        <option value="png" title="View a series of PNG images">PNG Stream</option>
	<!-- <option value="m3u8" title="View an HLS (HTTP Live Streaming) video stream">M3U8 Stream</option> -->
        <option value="loop" title="Loop through available video clips">Loop Videos</option>
        <option value="mp4" selected title="View an MP4 video stream">MP4 Stream</option>
        <option value="live" title="View the direct live stream">Live Video</option>
        <option value="motion" title="View motion-detected frames">Motion</option>
        <option value="mjpg" title="View an MJPEG (Motion JPEG) stream">MJPG</option>
    </select>


    <select id="camera-selector" onchange="changeCamera()">
        <option value="All" title="View all cameras">All</option>
        {% set all_groups = [] %}
        {% for camera, details in template_details.items() %}
            {% if details.groups %}
                {% for group in details.groups.split(',') %}
                    {% if group %}
                        {% set _ = all_groups.append(group|trim) %}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endfor %}
        {% for group in all_groups|unique|sort %}
            <option value="group-{{ group }}" title="View cameras in group {{ group }}">Group: {{ group }}</option>
        {% endfor %}
        {% for camera in template_details.keys()|sort %}
            <option value="{{ camera }}" title="View camera {{ camera }}">Camera: {{ camera }}</option>
        {% endfor %}
    </select>



            </div>


        </div>
        <div id="video-overlay" class="video-overlay">
            <div id="loading-indicator" class="hidden">Loading...</div>
            <div id="play-pause-indicator" class="video-icon hidden">▶</div>
            <div id="offline-indicator" class="offline-indicator hidden">
                <i class="fas fa-video-slash video-icon"></i>
                <p id="offline-message"></p>
            </div>
            <div id="capture-error-indicator" class="error-indicator hidden">
                <i class="fas fa-exclamation-triangle video-icon"></i>
                <p id="capture-error-message"></p>
            </div>
        </div>
        <div id="error-message"></div>
    </div>



    <div id="template-details"></div>

    <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
    <script>
        window.templateDetails = {{ template_details|tojson }};
    </script>
    <script type="module" src="{{ url_for('static', filename='js/live.js') }}"></script>

{% endblock %}
