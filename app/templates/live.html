{% extends 'base.html' %} {% block content %}
<div
  class="video-container full-height"
  role="region"
  aria-label="Live video feed"
>
  <video
    id="live-video"
    controls
    autoplay
    muted
    preload="none"
    poster="/last_screenshot/{{ template_details.keys()|list|first }}"
  >
    <source type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <div id="controls-wrapper" class="fade-out">
    <div id="speed-container">
      <label for="speed-slider" class="sr-only">Speed</label>
      <input
        type="range"
        id="speed-slider"
        min="1"
        max="60"
        value="1"
        step="1"
        aria-label="Playback speed"
      />
      <span id="speed-value">1fps</span>
    </div>
  </div>
</div>
<script>
  window.templateDetails = {{ template_details|tojson }};
</script>

<script
  type="module"
  src="{{ url_for('static', filename='js/tile_player.js') }}"
></script>
{% endblock %}
