name: Build Release Packages

on:
  push:
    branches: [main, staging]
    tags:
      - "v*"
  # Also handle releases created from the GitHub UI
  release:
    types: [published]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build_debian:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 ruff pytest pytest-socket
          pip install .
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Lint with ruff
        run: ruff check --exit-zero .
      - name: Test with pytest
        run: |
          pytest
      - name: Build Debian package
        run: |
          ./build_packages.sh
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Generate release badges
        run: |
          python scripts/generate_release_badges.py
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Upload Debian package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: debian/glimpser.deb
          body_path: release-badges.md

  build_windows:
    runs-on: windows-latest
    needs: build_debian
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: Install project requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Build Windows executable
        run: python build_windows.py
      - name: Upload Windows executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Glimpser.exe

  build_macos:
    runs-on: macos-latest
    needs: build_debian
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip && pip install pyinstaller
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Build macOS executable
        run: python build_macos.py
      - name: Upload macOS archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Glimpser
