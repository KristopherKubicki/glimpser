name: Build Release Packages

on:
  push:
    branches: [main, staging]
    tags:
      - "v*"
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

jobs:
  build_debian:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies with uv
        run: uv pip install --system --editable . --group dev
      - name: Lint with ruff
        run: ruff check .
      - name: Test with pytest
        run: |
          pytest
      - name: Build Debian package
        run: |
          ./build_packages.sh
      - name: Build Python distributions
        run: |
          uv pip install --system build
          python -m build
      - name: Generate release badges
        run: |
          python scripts/generate_release_badges.py
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v') && env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
      - name: Upload Debian package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: debian/glimpser.deb
          body_path: release-badges.md

  build_windows:
    runs-on: windows-latest
    needs: build_debian
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install uv
        shell: bash
        run: python -m pip install --upgrade uv
      - name: Install PyInstaller
        shell: bash
        run: uv pip install --system pyinstaller
      - name: Install project requirements
        shell: bash
        run: uv pip install --system .
      - name: Build Windows executable
        run: python build_windows.py
      - name: Upload Windows executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Glimpser.exe

  build_macos:
    runs-on: macos-latest
    needs: build_debian
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install PyInstaller
        run: uv pip install --system pyinstaller
      - name: Install project requirements
        run: uv pip install --system .
      - name: Build macOS executable
        run: python build_macos.py
      - name: Upload macOS archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Glimpser
