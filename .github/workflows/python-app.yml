# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main", "staging"]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    branches: ["main", "staging"]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      ENABLE_MYPY: "false"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies with uv
        run: |
          uv pip install --system --editable . --group dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Node dependencies
        run: npm install
        # Jest and Prettier are devDependencies installed here
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-
      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: changed
        # v44 contained a vulnerability allowing secret leakage
        # via logs. v45 or later resolves this issue.
        uses: tj-actions/changed-files@v45
      - name: Run pre-commit on changed files
        if: github.event_name == 'pull_request'
        run: pre-commit run --files ${{ steps.changed.outputs.all_changed_files }}
      - name: Run pre-commit
        if: github.event_name != 'pull_request'
        run: pre-commit run --all-files
      - name: Run JavaScript tests with coverage
        run: npm test -- --coverage
      - name: Audit npm packages
        run: npm audit --audit-level=high
      # Temporary until Selenium 4.34 is released
      - name: Run pip-audit
        run: pip-audit --ignore-vuln GHSA-48p4-8xcf-vxj5 --ignore-vuln GHSA-pq67-6m6q-mj2v
      - name: Type check with mypy
        if: env.ENABLE_MYPY == 'true'
        run: mypy .
      - name: Test with coverage
        run: |
          pytest --cov=app --cov-report=xml --color=yes
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
