# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      ENABLE_MYPY: "false"
      PYTEST_ADDOPTS: "-n auto"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies with uv
        run: |
          uv pip install --system --editable . --group dev
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Node dependencies
        run: npm install
        # Jest and Prettier are devDependencies installed here
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run JavaScript tests with coverage
        run: npm test -- --coverage
      - name: Audit npm packages
        run: npm audit --audit-level=high
      # Temporary until Selenium 4.34 is released
      - name: Run pip-audit
        run: pip-audit --ignore-vuln GHSA-48p4-8xcf-vxj5 --ignore-vuln GHSA-pq67-6m6q-mj2v
      - name: Type check with mypy
        if: env.ENABLE_MYPY == 'true'
        run: mypy .
      - name: Test with coverage
        run: |
          python -m coverage run -m pytest --color=yes
          python -m coverage xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
