name: Dependency Scan (OWASP Dependency-Check)

on:
  # run on pushes and PRs targeting the main branch + a weekly scheduled scan
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 0'      # every Sunday @ 06:00 UTC

permissions:
  contents: read
  security-events: write      # needed for SARIF upload

jobs:
  depcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Optional but highly recommended – avoids re-downloading the NVD feed
      - name: Restore Dependency-Check DB cache
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check
          key: depcheck-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/package*.json', '**/pom.xml') }}

      # Run the scan
      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: glimpser
          path: '.'                     # scan entire checkout
          format: 'SARIF,HTML'
          out: 'reports'                # --> reports/dependency-check-report.*
          args: >
            --enableExperimental        # turn on Pip/PyDist analyzers
            --failOnCVSS 7              # fail the job on high/critical vulns
        env:
          # only necessary if another action changed JAVA_HOME earlier;
          # keeps the value expected by the dep-check Docker image
          JAVA_HOME: /opt/jdk

      # Persist the human-readable HTML report
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-html
          path: reports/*.html

      # Push the SARIF into GitHub Advanced Security / Code Scanning
      - name: Publish results to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

