name: Tag Release

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  tag_release:
    permissions:
      contents: write
      # "workflow" is not a valid permission key.
      # A writeable contents token is sufficient for creating tags,
      # which can then trigger other workflows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version change
        id: detect
        run: |
          git fetch --tags
          NEW_VERSION=$(grep -oP '(?<=version=")[^"]+' setup.py)
          OLD_VERSION=$(git show ${{ github.event.before }}:setup.py 2>/dev/null | grep -oP '(?<=version=")[^"]+' || echo "")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag
        if: steps.detect.outputs.changed == 'true'
        run: |
          python scripts/auto_tag_release.py
