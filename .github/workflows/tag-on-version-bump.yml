name: Tag Release

on:
  push:
    branches: [ "main" ]

jobs:
  tag_release:
    permissions:
      contents: write
      # Allow the push to trigger other workflows (e.g. package release)
      workflow: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version change
        id: detect
        run: |
          git fetch --tags
          NEW_VERSION=$(grep -oP '(?<=version=")[^"]+' setup.py)
          OLD_VERSION=$(git show ${{ github.event.before }}:setup.py 2>/dev/null | grep -oP '(?<=version=")[^"]+' || echo "")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$NEW_VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create tag
        if: steps.detect.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.detect.outputs.new }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists" && exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
